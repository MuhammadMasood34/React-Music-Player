version: '3.8'

services:
  # Frontend - React Vite App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3000

  # Backend - Node.js/Express with Socket.io
  backend:
    build:
      context: ./base_server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - ENV=production
      - PORT=3000
      - SERVER_URL=http://localhost:3000
      - CLIENT_URL=http://localhost
      - CORS_ORIGINS=http://localhost,http://localhost:80
      - DATABASE_URL=${DATABASE_URL}
      - SALT_ROUNDS=10
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-anyrandomlongsecretkey123456789}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-anotherrandomlongsecretkey987654321}
      - DNS_SERVERS=1.1.1.1,8.8.8.8
    restart: unless-stopped
